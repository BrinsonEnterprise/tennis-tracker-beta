<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b8f3c" />
  <meta name="robots" content="noindex" />
  <title>Reset Password</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="beta-cloud.css" />
  <style>
    body { margin: 0; background: #f4f7f5; color: #1d2923; line-height: 1.5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 440px; margin: 0 auto; padding: 32px 16px; }
    .card { background: #fff; border: 1px solid #d9e1dc; border-radius: 16px; padding: 20px; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    img { display: block; margin: 0 auto 16px; border-radius: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="" width="64" height="64" />
    <div class="card">
      <h1>Choose a new password</h1>
      <p id="status" class="beta-msg beta-msg-info" role="status">Checking your reset link…</p>
      <form id="resetForm" class="beta-form" novalidate hidden>
        <label for="newPassword">New password</label>
        <input id="newPassword" class="beta-input" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pwHelp" />
        <p id="pwHelp" class="beta-help">At least 8 characters.</p>
        <label for="confirmPassword">Type it again</label>
        <input id="confirmPassword" class="beta-input" type="password" autocomplete="new-password" minlength="8" required />
        <button id="saveBtn" type="submit" class="beta-btn beta-btn-primary">Save new password</button>
      </form>
      <p id="done" hidden>Now open the app (from your home-screen icon), tap ☁ and sign in with your new password.</p>
      <p><a href="./">Open the app</a></p>
    </div>
  </main>
  <script src="beta-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script>
    (() => {
      "use strict";
      const cfg = window.BETA_CONFIG || {};
      const statusEl = document.getElementById("status");
      const form = document.getElementById("resetForm");
      const done = document.getElementById("done");
      const pw = document.getElementById("newPassword");
      const pw2 = document.getElementById("confirmPassword");
      const saveBtn = document.getElementById("saveBtn");
      const setStatus = (kind, text) => { statusEl.className = `beta-msg beta-msg-${kind}`; statusEl.setAttribute("role", kind === "error" ? "alert" : "status"); statusEl.textContent = text; statusEl.hidden = !text; };

      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) {
        setStatus("error", "Password reset isn't available in this build.");
        return;
      }
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const queryParams = new URLSearchParams(window.location.search);
      const linkError = hashParams.get("error_description") || queryParams.get("error_description");
      const isRecoveryLink = hashParams.get("type") === "recovery" || queryParams.has("code");
      if (linkError) {
        setStatus("error", `This reset link didn't work (${linkError}). Go back to the app, tap ☁ → Sign in → Forgot password, and request a new one.`);
        return;
      }

      const client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "tst-beta-auth" }
      });

      let ready = false;
      const showForm = () => {
        if (ready) return;
        ready = true;
        setStatus("info", "Enter your new password below.");
        form.hidden = false;
        pw.focus();
      };
      client.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") showForm();
      });
      window.setTimeout(async () => {
        if (ready) return;
        const { data } = await client.auth.getSession();
        if (data.session && isRecoveryLink) showForm();
        else setStatus("error", "This reset link is invalid or has expired. Go back to the app, tap ☁ → Sign in → Forgot password, and request a new one.");
      }, 2500);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (pw.value.length < 8) { setStatus("error", "Use at least 8 characters."); return; }
        if (pw.value !== pw2.value) { setStatus("error", "The two passwords don't match."); return; }
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        const { error } = await client.auth.updateUser({ password: pw.value });
        saveBtn.disabled = false;
        saveBtn.textContent = "Save new password";
        if (error) { setStatus("error", error.message || "Couldn't save the new password. Try again."); return; }
        form.hidden = true;
        done.hidden = false;
        setStatus("success", "Password updated.");
        history.replaceState(null, "", window.location.pathname);
      });
    })();
  </script>
</body>
</html>
